server:
  port: 8080
spring:
  application:
    name: group-finance-tracker
  profiles:
    active: postgres
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/group_finance}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  h2:
    console:
      enabled: false
  sql:
    init:
      mode: never
springdoc:
  swagger-ui:
    path: /swagger-ui.html
